services:
  lab:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      ORION_UPSTREAM: ${ORION_UPSTREAM:-http://orion:8000}
      ORION_AUTHORIZATION: ${ORION_AUTHORIZATION:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your environment}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://lab.sw4nit.dev}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      LAB_ANALYST_EMAILS: ${LAB_ANALYST_EMAILS:-}
      LAB_ADMIN_EMAILS: ${LAB_ADMIN_EMAILS:-}
    networks:
      - edge
      - services
      - orion

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - edge

networks:
  edge: {}
  services:
    internal: true
  orion:
    external: true
    name: reconix-cloud_default
